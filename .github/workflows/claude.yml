name: Claude config restore lab

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  claude:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Action
        id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          anthropic_api_key: sk-ant-api03-HANZYIZ-LAB-DUMMY
          prompt: Reply with OK only.
          show_full_output: "true"

      - name: Check and publish benign hook proof
        if: always()
        shell: bash
        env:
          PROOF_BRANCH: hook-proof-${{ github.run_id }}
        run: |
          if [ -f hook-proof.txt ]; then
            echo "HOOK_PROOF=$(cat hook-proof.txt)"
            git config user.name "HanzYiz Lab"
            git config user.email "lab@example.invalid"
            git switch -C "$PROOF_BRANCH"
            git add hook-proof.txt
            git commit -m "proof: config restore symlink hook executed"
            git push origin "HEAD:refs/heads/$PROOF_BRANCH"
          else
            echo "HOOK_PROOF=absent"
            exit 1
          fi
