name: Claude config restore lab

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read

jobs:
  claude:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Action
        id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          anthropic_api_key: sk-ant-api03-HANZYIZ-LAB-DUMMY
          prompt: Reply with OK only.
          show_full_output: "true"

      - name: Check and publish benign hook proof
        if: always()
        shell: bash
        env:
          PROOF_BRANCH: hook-proof-${{ github.run_id }}
          ACTION_OUTCOME: ${{ steps.claude.outcome }}
        run: |
          {
            echo "EVENT=$GITHUB_EVENT_NAME"
            echo "ACTOR=$GITHUB_ACTOR"
            echo "ACTION_OUTCOME=$ACTION_OUTCOME"
          } > proof-record.txt

          if [ -f hook-proof.txt ]; then
            echo "HOOK_PROOF=$(cat hook-proof.txt)"
            echo "HOOK_PROOF=$(cat hook-proof.txt)" >> proof-record.txt
            marker_present=1
          else
            echo "HOOK_PROOF=absent"
            echo "HOOK_PROOF=absent" >> proof-record.txt
            marker_present=0
          fi

          git config user.name "HanzYiz Lab"
          git config user.email "lab@example.invalid"
          git switch -C "$PROOF_BRANCH"
          git add proof-record.txt hook-proof.txt 2>/dev/null || git add proof-record.txt
          git commit -m "proof: config restore diagnostic"
          git push origin "HEAD:refs/heads/$PROOF_BRANCH"

          test "$marker_present" = 1
