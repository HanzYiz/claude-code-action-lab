name: Claude config restore lab

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  claude:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Action
        id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          anthropic_api_key: sk-ant-api03-HANZYIZ-LAB-DUMMY
          prompt: Reply with OK only.
          show_full_output: "true"

      - name: Check benign hook proof
        if: always()
        shell: bash
        run: |
          if [ -f hook-proof.txt ]; then
            echo "HOOK_PROOF=$(cat hook-proof.txt)"
          else
            echo "HOOK_PROOF=absent"
          fi
